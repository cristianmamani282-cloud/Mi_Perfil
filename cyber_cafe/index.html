<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Game Zone</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="contenedor">

        <h1 id="titulo">🎮 Cyber Game Zone</h1>

        <div class="card-btn" data-tema="pc">
            💻 Computadoras Libres (5)
        </div>

        <div class="card-info">
            <p>5 computadoras disponibles para juegos y navegación.</p>
        </div>

        <div class="card-btn" data-tema="ps">
            🎮 PlayStation Libres (5)
        </div>

        <div class="card-info">
            <p>5 consolas PlayStation listas para jugar.</p>
        </div>

        <div class="card-btn" data-tema="xbox">
            🕹️ Xbox Libres (3)
        </div>

        <div class="card-info">
            <p>3 consolas Xbox disponibles.</p>
        </div>

        <div class="card-btn" data-tema="cafe">
            ☕ Zona Libre de Mesas
        </div>

        <div class="card-info">
            <p>Espacio para descansar, estudiar o consumir alimentos.</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>

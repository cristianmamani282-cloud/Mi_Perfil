<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan Page José Madero</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background-image: url("https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: white;
    }

    .overlay{
        background-color: rgba(0,0,0,0.75);
        min-height: 100vh;
        padding: 30px;
    }

    h1{
        text-align:center;
        margin-bottom:20px;
        color:#ffcc00;
    }

    section{
        margin:30px auto;
        max-width:1000px;
        background:rgba(255,255,255,0.1);
        padding:20px;
        border-radius:10px;
    }

    iframe{
        width:100%;
        height:450px;
        border:none;
        border-radius:10px;
    }

    .galeria{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:15px;
    }

    .galeria img{
        width:100%;
        border-radius:10px;
        height:250px;
        object-fit:cover;
    }

    .videos{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
        gap:20px;
    }

    .videos iframe{
        height:250px;
    }
</style>

</head>
<body>

<div class="overlay">

    <h1>José Madero Fan Page</h1>

    <section>
        <h2>Video Destacado</h2>
        <br>
        
        <iframe width="560" height="315" src="https://www.youtube.com/embed/CpURkOF3PvM?si=BXVanTz5KzyI0VFf" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    </section>

    <section>
        <h2>Galería de Imágenes</h2>
        <br>

        <div class="galeria">

            <img src="https://open.spotify.com/artist/62nVRNDLaS8m1p31F6omGw">

            <img src="https://media.gq.com.mx/photos/62df0f7f6d6c9d980823e24a/16:9/w_1920,c_limit/Jose%20Madero%20foto%20GQ.jpg">

            <img src="https://www.telehit.com/_next/image?url=https%3A%2F%2Fst1.uvnimg.com%2F9e%2F56%2Fd3f080bb79e00226af023374f7bc%2Fjose-madero-120408667-720530018553003-4133516504455462519-n.jpg&w=1280&q=75">

        </div>
    </section>
    <section>
        <h2>musicas mas polupalres</h2>
        <br>

        <div class="videos">

           <iframe width="560" height="315" src="https://www.youtube.com/embed/rjRelBT91cw?si=FygmFfhpeEVOBQgH" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/4TnoY0MBm48?si=piKULHlTjyPWsqrK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/F7dyFU3SqfU?si=C5k1i7lNuvnpqEwe" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        </div>

    </section>

</div>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0715"/>
      <stop offset="35%" stop-color="#1b0e2b"/>
      <stop offset="65%" stop-color="#3d123d"/>
      <stop offset="90%" stop-color="#6b1747"/>
      <stop offset="100%" stop-color="#a82352"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1438"/>
      <stop offset="100%" stop-color="#12091c"/>
    </linearGradient>
    <linearGradient id="mountGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0d24"/>
      <stop offset="100%" stop-color="#09050e"/>
    </linearGradient>
    <linearGradient id="cityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120a1c"/>
      <stop offset="100%" stop-color="#07040b"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="500" height="320" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="45" cy="25" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="95" cy="45" r="0.9" fill="#ffffff" opacity="0.8"/>
  <circle cx="160" cy="20" r="0.7" fill="#ffffff" opacity="0.5"/>
  <circle cx="210" cy="50" r="1.1" fill="#ffffff" opacity="0.9"/>
  <circle cx="340" cy="30" r="0.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="420" cy="40" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="460" cy="65" r="0.7" fill="#ffffff" opacity="0.5"/>
  <circle cx="280" cy="18" r="0.9" fill="#ffffff" opacity="0.7"/>

  <!-- Crimson Sun -->
  <circle cx="305" cy="120" r="42" fill="url(#sunGlow)"/>
  <circle cx="305" cy="120" r="19" fill="#ff2e63" filter="url(#neonBlur)"/>

  <!-- Back Mountains (Illimani silhouette) -->
  <path d="M-20 220 L60 160 L140 185 L220 125 L250 145 L320 110 L370 150 L440 130 L520 210 L520 320 L-20 320 Z" fill="url(#mountGrad1)" opacity="0.95"/>

  <!-- Snow/Ridge Highlights -->
  <path d="M220 125 L227 138 L214 142 Z" fill="#ff7597" opacity="0.25"/>
  <path d="M320 110 L330 125 L312 128 Z" fill="#ff7597" opacity="0.35"/>
  <path d="M440 130 L446 142 L433 145 Z" fill="#ff7597" opacity="0.2"/>

  <!-- Mid Mountains Layer -->
  <path d="M-10 240 L70 190 L160 215 L240 170 L330 200 L410 165 L510 230 L510 320 L-10 320 Z" fill="url(#mountGrad2)"/>

  <!-- City Skyline Silhouette -->
  <g fill="url(#cityGrad)">
    <rect x="15" y="225" width="22" height="95"/>
    <rect x="42" y="210" width="18" height="110"/>
    <rect x="65" y="235" width="25" height="85"/>
    <rect x="95" y="195" width="30" height="125"/>
    <rect x="130" y="220" width="20" height="100"/>
    <rect x="155" y="205" width="28" height="115"/>
    <rect x="190" y="240" width="22" height="80"/>
    <rect x="218" y="215" width="35" height="105"/>
    <rect x="260" y="230" width="24" height="90"/>
    <rect x="290" y="190" width="32" height="130"/>
    <rect x="330" y="215" width="26" height="105"/>
    <rect x="362" y="200" width="30" height="120"/>
    <rect x="400" y="235" width="24" height="85"/>
    <rect x="430" y="210" width="35" height="110"/>
    <rect x="470" y="228" width="25" height="92"/>

    <!-- Antennas / Spires -->
    <line x1="110" y1="195" x2="110" y2="175" stroke="#120a1c" stroke-width="2"/>
    <line x1="306" y1="190" x2="306" y2="170" stroke="#120a1c" stroke-width="2"/>
    <line x1="377" y1="200" x2="377" y2="182" stroke="#120a1c" stroke-width="2"/>
  </g>

  <!-- Glowing City Window Dots -->
  <g fill="#ff3388" opacity="0.75">
    <circle cx="50" cy="225" r="1.2"/>
    <circle cx="54" cy="245" r="1"/>
    <circle cx="102" cy="215" r="1.2"/>
    <circle cx="115" cy="235" r="1"/>
    <circle cx="108" cy="265" r="1"/>
    <circle cx="165" cy="220" r="1.2"/>
    <circle cx="230" cy="230" r="1.2"/>
    <circle cx="300" cy="210" r="1.2"/>
    <circle cx="312" cy="240" r="1"/>
    <circle cx="372" cy="225" r="1.2"/>
    <circle cx="445" cy="230" r="1.2"/>
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="46" cy="235" r="1"/>
    <circle cx="112" cy="220" r="1"/>
    <circle cx="140" cy="245" r="1"/>
    <circle cx="240" cy="250" r="1"/>
    <circle cx="305" cy="225" r="1"/>
    <circle cx="380" cy="240" r="1"/>
    <circle cx="450" cy="255" r="1"/>
  </g>
</svg>


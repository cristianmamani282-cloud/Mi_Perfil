<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A588C"/>
      <stop offset="100%" stop-color="#3D2E55"/>
    </linearGradient>
    <linearGradient id="butterflyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EADDF7"/>
      <stop offset="100%" stop-color="#D6BEF0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <g transform="translate(256, 230) scale(0.85)" filter="url(#softGlow)">
    <!-- Left upper wing -->
    <path d="M 0,-20 C -40,-130 -140,-170 -210,-110 C -250,-70 -240,20 -180,80 C -120,140 -40,160 0,140"
          fill="none" stroke="url(#butterflyGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left lower wing -->
    <path d="M 0,140 C -60,180 -150,220 -170,160 C -190,100 -120,70 -80,50"
          fill="none" stroke="url(#butterflyGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Right upper wing -->
    <path d="M 0,-20 C 40,-130 140,-170 210,-110 C 250,-70 240,20 180,80 C 120,140 40,160 0,140"
          fill="none" stroke="url(#butterflyGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Right lower wing -->
    <path d="M 0,140 C 60,180 150,220 170,160 C 190,100 120,70 80,50"
          fill="none" stroke="url(#butterflyGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wing inner decorative lines -->
    <path d="M -20,-10 C -90,-40 -160,-20 -180,40" fill="none" stroke="url(#butterflyGrad)" stroke-width="7" opacity="0.8"/>
    <path d="M 20,-10 C 90,-40 160,-20 180,40" fill="none" stroke="url(#butterflyGrad)" stroke-width="7" opacity="0.8"/>
    <path d="M -10,80 C -60,110 -110,120 -130,90" fill="none" stroke="url(#butterflyGrad)" stroke-width="6" opacity="0.8"/>
    <path d="M 10,80 C 60,110 110,120 130,90" fill="none" stroke="url(#butterflyGrad)" stroke-width="6" opacity="0.8"/>

    <!-- Central body -->
    <path d="M 0,-60 L 0,160" stroke="url(#butterflyGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Antennae -->
    <path d="M 0,-60 C -20,-90 -45,-105 -60,-95" fill="none" stroke="url(#butterflyGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-60" cy="-95" r="7" fill="#FFFFFF"/>
    
    <path d="M 0,-60 C 20,-90 45,-105 60,-95" fill="none" stroke="url(#butterflyGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="60" cy="-95" r="7" fill="#FFFFFF"/>
  </g>
  
  <!-- ASIO typography -->
  <text x="256" y="445" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" letter-spacing="12" fill="#FFFFFF" text-anchor="middle">ASIO</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="6" fill="#D6BEF0" text-anchor="middle">SPA ASIÁTICO</text>
</svg>